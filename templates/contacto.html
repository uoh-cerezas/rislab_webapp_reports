<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>

</head>
<body class="contact-page">

    {% include 'lateral.html' %}
      <div id="right-panel" class="right-panel">

    {% include 'header.html' %}


          <div class="content-wrapper">
          <div class="col-lg-6">


            <div class="card">
              <div class="card-header">
                <i class="ti-headphone-alt"></i>
                <strong>Formulario de Contacto</strong>
              </div>
              <div class="card-body card-block">
                <form action="{{url_for('send_mail')}}" method="post" enctype="multipart/form-data" class="form-horizontal">

                  <div class="row form-group">
                    <div class="col col-md-3">
                      <label for="text-input" class="form-control-label">
                      Titulo <span class="text-danger">*</span>
                      </label>
                    </div>
                    <div class="col-12 col-md-9">
                      <input type="text" id="text-input" name="title"
                      required placeholder="Titulo..."
                        class="form-control" />

                    </div>
                  </div>
                  

                  <div class="row form-group">
                    <div class="col col-md-3">
                      <label for="email-input" class="form-control-label">
                        Correo de contacto <span class="text-danger">*</span>
                      </label>
                    </div>
                    <div class="col-12 col-md-9">
                      <input type="email" id="email-input" name="email"
                        value="{{ session.get('user', '') }}"
                        placeholder="tu-correo@ejemplo.com" class="form-control" required />
                    </div>
                  </div>


                  <div class="row form-group">
                    <div class="col col-md-3">
                      <label for="textarea-input" class="form-control-label">
                        Consulta <span class="text-danger">*</span>
                      </label>
                    </div>
                    <div class="col-12 col-md-9">
                      <textarea name="mensaje" id="textarea-input" rows="9" required
                        placeholder="Agrega tu descripción aquí..." style="resize: none;"
                        class="form-control"></textarea>
                    </div>

                  </div>
                  <div class="submit-row ">
                    <button type="submit" class="btn btn-primary btn-submit shadow-sm">
                      <i class="ti-check mr-2"></i><strong>Enviar</strong>
                    </button>
                    <button type="reset" class="btn btn-submit btn-reset shadow-sm" onclick="resetForm()">
                      <i class="ti-reload mr-2"></i><strong>Reiniciar</strong>
                    </button>
                  </div>
                </form>
              </div>
              </div>
            </div>
          </div>

    {% include 'footer.html' %}
      </div>


    <script src="https://cdn.jsdelivr.net/npm/jquery@2.2.4/dist/jquery.min.js"></script>

    <script src="{{ url_for('static', filename='js/contactForm.js') }}"></script>
