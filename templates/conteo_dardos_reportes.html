  <meta name="description" content="Ela Admin - HTML5 Admin Template" />

  <link rel="shortcut icon" href="/static/images/FIC_logo_pestana.png" />

  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700,800" rel="stylesheet" type="text/css" />

  <style>
    .col-lg-6 {
      flex: 0 0 100%;
      max-width: 100%;
    }
  </style>

  <!-- <script type="text/javascript" src="https://cdn.jsdelivr.net/html5shiv/3.7.3/html5shiv.min.js"></script> -->
</head>

<body>
  <!-- Left Panel -->
  {% include 'lateral.html' %}
  <!-- Left Panel -->

  <!-- Right Panel -->

  <div id="right-panel" class="right-panel">
    <!-- Header-->
    {% include 'header.html' %}
    <!-- /header -->
    <!-- Header-->

    <div class="breadcrumbs">
      <div class="breadcrumbs-inner">
        <div class="row m-0">
          <h2>Mis reportes</h2>

        </div>
        <div class="row">
          &nbsp;
        </div>
        <div class="row m-0">
          <div class="col-12">
            <div class="parrafo-upload">
              <p>Navega entre tus reportes ya generados de conteo automatizado de dardos.</p>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div class="content">
      <div class="animated fadeIn">
        <div class="row">


          <div class="col-lg-6">
            <!-- TABLA A REEMPLAZAR AL CONECTAR CON LA BASE DE DATOS -->
            <div class="card">
              <div class="card-body">
                <div class="row">

                  <div class="col-sm-12 col-md-6">
                    <div id="bootstrap-data-table_filter" class="dataTables_filter">
                      <label>Campo: <input type="text" id="filterField" class="form-control form-control-sm"
                          placeholder="">
                      </label>
                    </div>
                  </div>
                  <div class="col-sm-12 col-md-6">
                    <div id="bootstrap-data-table_filter" class="dataTables_filter">
                      <label>Desde: <input type="date" id="filterDateFrom" class="form-control form-control-sm"
                          placeholder="">
                      </label>
                    </div>
                  </div>
                  <div class="col-sm-12 col-md-6">
                    <div id="bootstrap-data-table_filter" class="dataTables_filter">
                      <label>Cuartel: <input type="text" id="filterZone" class="form-control form-control-sm"
                          placeholder="">
                      </label>
                    </div>
                  </div>
                  <div class="col-sm-12 col-md-6">
                    <div id="bootstrap-data-table_filter" class="dataTables_filter">
                      <label>Hasta: <input type="date" id="filterDateTo" class="form-control form-control-sm"
                          placeholder="">
                      </label>
                    </div>
                  </div>
                  <div class="row">
                    &nbsp;
                  </div>
                  <div class="col-sm-12 col-md-6">
                    <div id="bootstrap-data-table_filter" class="dataTables_filter"> <button id="clearFilters"
                        class="btn btn-outline-primary">Limpiar filtros</button>
                    </div>
                  </div>

                </div>

                <div class="row">
                  &nbsp;
                </div>

                <table class="table">
                  <thead>
                    <tr>
                      <th scope="col">Numero</th>
                      <th scope="col">Campo</th>
                      <th scope="col">Cuartel</th>
                      <th scope="col">Fecha</th>
                      <th scope="col">Ver reporte</th>
                    </tr>
                  </thead>
                  <tbody id="tableBody">

                  </tbody>
                </table>
                <div style="display: flex; justify-content: center;list-style:none;">
                  <li class="paginate_button page-item previous" id="prevBtn"><a href="#" class="page-link">Anterior</a>
                  </li>
                  <li class="paginate_button page-item"><a id="pageInfo" class="page-link">1</a></li>
                  <li class="paginate_button page-item next" id="nextBtn"><a href="#" class="page-link">Siguiente</a>
                  </li>
                </div>
              </div>
            </div>

          </div>
        </div>
        <!-- .animated -->
      </div>
      <!-- .content -->

      <div class="clearfix"></div>

      {% include 'footer.html' %}
    </div>
    <script id="reports-data" type="application/json">
      {{ reports | tojson }}
    </script>

    <script>
      // Data from Flask
      const reportsData = JSON.parse(document.getElementById('reports-data').textContent);
      const perPage = 10;
      let currentPage = 1;

      const tableBody = document.getElementById('tableBody');
      const pageInfo = document.getElementById('pageInfo');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      function applyFilters(data) {
        const fieldFilter = document.getElementById('filterField').value.toLowerCase();
        const zoneFilter = document.getElementById('filterZone').value;
        const fromDate = document.getElementById('filterDateFrom').value;
        const toDate = document.getElementById('filterDateTo').value;

        return data.filter(r => {

          const matchesField = r.field.toLowerCase().includes(fieldFilter);
          const matchesZone = zoneFilter === '' || r.zone == Number(zoneFilter);
          let matchesDate = true;
          if (fromDate || toDate) {
            const reportDate = new Date(r.date * 1000);
            if (fromDate && reportDate < new Date(fromDate)) matchesDate = false;
            if (toDate && reportDate > new Date(toDate)) matchesDate = false;
          }
          return matchesField && matchesZone && matchesDate;
        });
      }

      function renderTable() {
        const filteredData = applyFilters(reportsData);
        const totalPages = Math.ceil(filteredData.length / perPage);

        if (currentPage > totalPages) currentPage = totalPages || 1;

        tableBody.innerHTML = '';

        const start = (currentPage - 1) * perPage;
        const end = start + perPage;
        const pageData = filteredData.slice(start, end);

        for (const r of pageData) {
          let f_name = r.field.slice(r.field.indexOf("-") + 1);
          f_name = f_name.replace(/-/g, " "); // replace all "-" with spaces
          f_name = f_name.charAt(0).toUpperCase() + f_name.slice(1);
          var date = new Date(r.date * 1000);
          const formattedTime = `${date.getDate()}/${date.getMonth() + 1}/${date.getFullYear()}`;
          const row = `<tr>
            <th scope="row">${r.name}</th>
            <td>${f_name}</td>
            <td>${r.zone}</td>
            <td>${formattedTime}</td>
            <td><a href="ver_reporte_budscount/${r.token}">Ver reporte</a></td>
          </tr>`;
          tableBody.insertAdjacentHTML('beforeend', row);
        }

        pageInfo.textContent = `Página ${currentPage} de ${totalPages || 1}`;

        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = currentPage >= totalPages;
      }

      prevBtn.addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          renderTable();
        }
      });

      nextBtn.addEventListener('click', () => {
        if ((currentPage * perPage) < reportsData.length) {
          currentPage++;
          renderTable();
        }
      });

      document.getElementById('filterField').addEventListener('input', () => {
        currentPage = 1;
        renderTable();
      });
      document.getElementById('filterZone').addEventListener('input', () => {
        currentPage = 1;
        renderTable();
      });
      document.getElementById('filterDateTo').addEventListener('input', () => {
        currentPage = 1;
        renderTable();
      });
      document.getElementById('filterDateFrom').addEventListener('input', () => {
        currentPage = 1;
        renderTable();
      });
      document.getElementById('clearFilters').addEventListener('click', () => {
        ["filterField", "filterZone", "filterDateTo", "filterDateFrom"].forEach(id => {
          document.getElementById(id).value = '';
        });
        currentPage = 1;
        renderTable();
      });
      renderTable(); 
    </script>
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@2.2.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.4/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-match-height@0.7.2/dist/jquery.matchHeight.min.js"></script>
    <!-- <script src="assets/js/main.js"></script> -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
