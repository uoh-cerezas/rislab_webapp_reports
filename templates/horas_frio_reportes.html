<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Mis Reportes</title>
  <meta name="description" content="Ela Admin - HTML5 Admin Template" />

  <link rel="shortcut icon" href="/static/images/FIC_logo_pestana.png" />

  <!-- <link rel="apple-touch-icon" href="https://i.imgur.com/QRAUqs9.png" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lykmapipo/themify-icons@0.1.2/css/themify-icons.css" />
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/pixeden-stroke-7-icon@1.2.3/pe-icon-7-stroke/dist/pe-icon-7-stroke.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.2.0/css/flag-icon.min.css" />

  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700,800" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="static/css/cs-skin-elastic.css">
  <link rel="stylesheet" href="static/css/style.css">
  <style>
    .col-lg-6 {
      flex: 0 0 100%;
      max-width: 100%;
    }
  </style>

  <!-- <script type="text/javascript" src="https://cdn.jsdelivr.net/html5shiv/3.7.3/html5shiv.min.js"></script> -->
</head>

<body>
  <!-- Left Panel -->
  {% include 'lateral.html' %}
  <!-- Left Panel -->

  <!-- Right Panel -->

  <div id="right-panel" class="right-panel">
    <!-- Header-->
    {% include 'header.html' %}
    <!-- /header -->
    <!-- Header-->

    <div class="breadcrumbs">
      <div class="breadcrumbs-inner">
        <div class="row m-0">
          <h2>Mis reportes agroclimáticos</h2>

        </div>
        <div class="row">
          &nbsp;
        </div>
        <div class="row m-0">
          <div class="col-12">
            <div class="parrafo-upload">
              <p>Navega entre tus reportes agroclimáticos ya generados.</p>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div class="content">
      <div class="animated fadeIn">
        <div class="row">


          <div class="col-lg-6">
            <!-- TABLA A REEMPLAZAR AL CONECTAR CON LA BASE DE DATOS -->
            <div class="card">
              <div class="card-body">
                <div class="row">

                  <div class="col-sm-12 col-md-6">
                    <div id="bootstrap-data-table_filter" class="dataTables_filter">
                      <label>Desde (Fecha de inicio): <input type="date" id="filterDateFrom" class="form-control form-control-sm"
                          placeholder="">
                      </label>
                    </div>
                  </div>
                  <div class="col-sm-12 col-md-6">
                    <div id="bootstrap-data-table_filter" class="dataTables_filter">
                      <label>Hasta (Fecha de inicio): <input type="date" id="filterDateTo" class="form-control form-control-sm"
                          placeholder="">
                      </label>
                    </div>
                  </div>
                  <div class="col-sm-12 col-md-6">
                    <div id="bootstrap-data-table_filter" class="dataTables_filter">
                      <label>Tipo:
                        <select id="filterKind" class="form-control form-control-sm">
                          <option value="">Todos</option>
                          <option value="daily">Diario</option>
                          <option value="weekly">Semanal</option>
                          <option value="monthly">Mensual</option>
                        </select>
                      </label>
                    </div>
                  </div>
                  {% if show_admin_tab %}
                  <div class="col-sm-12 col-md-6">
                    <div id="bootstrap-data-table_filter" class="dataTables_filter">
                      <label>Campo:
                        <select id="filterField" class="form-control form-control-sm">
                          <option value="">Todos los campos</option>
                        </select>
                      </label>
                    </div>
                  </div>
                  {% endif %}
                  <div class="row">
                    &nbsp;
                  </div>
                  <div class="col-sm-12 col-md-6">
                    <div id="bootstrap-data-table_filter" class="dataTables_filter"> <button id="clearFilters"
                        class="btn btn-outline-primary">Limpiar filtros</button>
                      <button id="downloadAll" class="btn btn-primary ml-2">Descargar todos</button>
                    </div>
                  </div>

                </div>

                <div class="row">
                  &nbsp;
                </div>

                <table class="table">
                  <thead>
                    <tr>
                      <th scope="col">Fecha</th>
                      <th scope="col">Tipo</th>
                      <th scope="col">Campo</th>
                      <th scope="col">Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tableBody">

                  </tbody>
                </table>
                <div style="display: flex; justify-content: center;list-style:none;">
                  <li class="paginate_button page-item previous" id="prevBtn"><a href="#" class="page-link">Anterior</a>
                  </li>
                  <li class="paginate_button page-item"><a id="pageInfo" class="page-link">1</a></li>
                  <li class="paginate_button page-item next" id="nextBtn"><a href="#" class="page-link">Siguiente</a>
                  </li>
                </div>
              </div>
            </div>

          </div>
        </div>
        <!-- .animated -->
      </div>
      <!-- .content -->

      <div class="clearfix"></div>

      {% include 'footer.html' %}
    </div>
    <script id="reports-data" type="application/json">
      {{ reports | tojson }}
    </script>

    <script>
      // Data from Flask
      const reportsData = JSON.parse(document.getElementById('reports-data').textContent);
      console.log(reportsData)
      const perPage = 10;
      let currentPage = 1;

      const tableBody = document.getElementById('tableBody');
      const pageInfo = document.getElementById('pageInfo');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const downloadAllBtn = document.getElementById('downloadAll');
      const fieldFilter = document.getElementById('filterField');

      function fieldLabel(field) {
        let label = String(field || '');
        const separator = label.indexOf('-');
        if (separator >= 0) label = label.slice(separator + 1);
        label = label.replace(/-/g, ' ');
        return label.charAt(0).toUpperCase() + label.slice(1);
      }

      if (fieldFilter) {
        [...new Set(reportsData.map(report => report['data-field']).filter(Boolean))]
          .sort()
          .forEach(field => {
            const option = document.createElement('option');
            option.value = field;
            option.textContent = fieldLabel(field);
            fieldFilter.appendChild(option);
          });
      }

      function applyFilters(data) {
        const fromDate = document.getElementById('filterDateFrom').value;
        const toDate = document.getElementById('filterDateTo').value;
        const kindFilter = document.getElementById('filterKind').value;
        const fieldValue = fieldFilter ? fieldFilter.value : '';

        return data.filter(r => {
          const matchesKind = kindFilter === '' || r.kind === kindFilter;
          const matchesField = fieldValue === '' || r['data-field'] === fieldValue;
          
          let matchesDate = true;
          if (fromDate || toDate) {
            const reportDate = r.report_date || '';
            if (fromDate && reportDate < fromDate) matchesDate = false;
            if (toDate && reportDate > toDate) matchesDate = false;
          }
          
          return matchesKind && matchesField && matchesDate;
        });
      }

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>'"]/g, char => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[char]));
      }

      function renderTable() {
        const filteredData = applyFilters(reportsData);
        const totalPages = Math.ceil(filteredData.length / perPage);

        if (currentPage > totalPages) currentPage = totalPages || 1;

        tableBody.innerHTML = '';

        const start = (currentPage - 1) * perPage;
        const end = start + perPage;
        const pageData = filteredData.slice(start, end);

        for (const r of pageData) {
          const f_name = fieldLabel(r["data-field"]);
          const formattedReportDate = r.report_date
            ? new Date(`${r.report_date}T12:00:00`).toLocaleDateString('es-CL')
            : '-';
          const row = `<tr>
            <td>${escapeHtml(formattedReportDate)}</td>
            <td>${escapeHtml(r.tipo)}</td>
            <td>${escapeHtml(f_name)}</td>
            <td>
              <a href="${escapeHtml(r.view_url)}" target="_blank" rel="noopener">Visualizar PDF</a>
              <span class="mx-1">|</span>
              <a href="${escapeHtml(r.download_url)}">Descargar PDF</a>
            </td>
          </tr>`;
          tableBody.insertAdjacentHTML('beforeend', row);
        }

        pageInfo.textContent = `Página ${currentPage} de ${totalPages || 1}`;

        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = currentPage >= totalPages;
      }

      prevBtn.addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          renderTable();
        }
      });

      nextBtn.addEventListener('click', () => {
        if ((currentPage * perPage) < applyFilters(reportsData).length) {
          currentPage++;
          renderTable();
        }
      });

      document.getElementById('filterDateTo').addEventListener('input', () => {
        currentPage = 1;
        renderTable();
      });
      document.getElementById('filterDateFrom').addEventListener('input', () => {
        currentPage = 1;
        renderTable();
      });
      document.getElementById('clearFilters').addEventListener('click', () => {
        ["filterDateTo", "filterDateFrom", "filterKind"].forEach(id => {
          document.getElementById(id).value = '';
        });
        if (fieldFilter) fieldFilter.value = '';
        currentPage = 1;
        renderTable();
      });
      document.getElementById('filterKind').addEventListener('change', () => {
        currentPage = 1;
        renderTable();
      });
      if (fieldFilter) {
        fieldFilter.addEventListener('change', () => {
          currentPage = 1;
          renderTable();
        });
      }

      downloadAllBtn.addEventListener('click', async () => {
        const filteredData = applyFilters(reportsData);
        if (!filteredData.length) {
          alert('No hay reportes para descargar con los filtros actuales.');
          return;
        }
        downloadAllBtn.disabled = true;
        downloadAllBtn.textContent = 'Preparando ZIP...';
        try {
          const response = await fetch("{{ url_for('download_generated_reports') }}", {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({tokens: filteredData.map(r => r.token)})
          });
          if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            throw new Error(error.error || 'No fue posible preparar el ZIP.');
          }
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'climate-reports.zip';
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
        } catch (error) {
          alert(error.message);
        } finally {
          downloadAllBtn.disabled = false;
          downloadAllBtn.textContent = 'Descargar todos';
        }
      });
      renderTable(); 
    </script>
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@2.2.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.4/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-match-height@0.7.2/dist/jquery.matchHeight.min.js"></script>
    <!-- <script src="assets/js/main.js"></script> -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
